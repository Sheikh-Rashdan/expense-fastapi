[project]
name = "expense-fastapi"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.142.2",
    "python-dotenv>=1.2.4",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.1.3",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "Depends"]
